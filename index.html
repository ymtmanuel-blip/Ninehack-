
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nine Hack - Notice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: #080c14; 
            color: #f3f4f6; 
            overflow-x: hidden;
        }

        .main-card { 
            background: rgba(17, 24, 39, 0.75); 
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .notice-box {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 1.25rem;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .redirect-box {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 1.25rem;
            padding: 1.25rem;
            text-align: left;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md text-center">
        <div class="main-card rounded-[2.5rem] p-8 md:p-10 relative">
            <div class="text-center">
                
                <!-- Title -->
                <h1 class="text-4xl font-black tracking-tighter mb-1 italic select-none text-white">
                    NINE HACK
                </h1>
                <p class="text-blue-400 font-mono text-[9px] tracking-[0.3em] uppercase mb-6">OFFICIAL NOTICE</p>

                <!-- Outdated Notice Box -->
                <div class="notice-box">
                    <div class="flex items-center gap-2 mb-2 text-red-400">
                        <span class="w-2 h-2 bg-red-500 rounded-full"></span>
                        <span class="font-mono text-[10px] font-bold tracking-wider uppercase">Page Unavailable</span>
                    </div>
                    <p class="text-base font-black text-white mb-1 italic">
                        This website is no longer available.
                    </p>
                    <p class="text-[11px] text-gray-400 leading-relaxed font-medium">
                        This host has been decommissioned and is no longer being updated or maintained.
                    </p>
                </div>

                <!-- New Domain Redirect Box -->
                <div class="redirect-box">
                    <div class="flex items-center gap-2 mb-2 text-blue-400">
                        <span class="w-2 h-2 bg-blue-400 rounded-full animate-ping"></span>
                        <span class="font-mono text-[10px] font-bold tracking-wider uppercase">New Address</span>
                    </div>
                    
                    <p class="text-xs font-bold text-gray-300 mb-3">
                        A new website is now available at:
                    </p>

                    <a href="https://Ninehack.gt.tc" target="_blank" class="block w-full bg-blue-600 hover:bg-blue-500 text-white font-black text-xs py-3.5 px-4 rounded-xl tracking-tight uppercase transition-all duration-200 active:scale-95 shadow-lg shadow-blue-600/30">
                        Ninehack.gt.tc
                    </a>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
